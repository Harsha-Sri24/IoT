<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Forgot / Reset Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    html,body{height:100%;margin:0;font-family:Arial;overflow:hidden;background:transparent}
    #bg1,#bg2{position:fixed;top:0;left:0;width:100%;height:100%;background-size:cover;background-position:center;transition:opacity 1.5s;z-index:-2}
    #overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.18);z-index:-1}
    .card{width:420px;padding:2rem;border-radius:18px;background:rgba(0,0,0,0.35);color:#fff;position:absolute;top:10%;right:5%;z-index:10}
    input.form-control{background:rgba(255,255,255,0.06);border:none;color:#fff}
    .alert{background:rgba(255,255,255,0.06);color:#fff;border:none}
    label{font-weight:600}
  </style>
</head>
<body>
  <div id="bg1" style="background-image:url('{{ url_for('static', filename='images/sunny.jpeg') }}')"></div>
  <div id="bg2"></div>
  <div id="overlay"></div>

  <div class="card">
    <h3>Forgot / Reset Password</h3>
    <p class="text-muted">Enter username + security question to verify</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}{% for category,message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %}{% endif %}
    {% endwith %}

    <form method="POST">
      <div class="mb-2"><label>Username</label><input class="form-control" name="username" required></div>

      <div class="mb-2">
        <label>Security Question</label>
        <select name="security_question" class="form-control" required>
          <option value="" disabled selected>Select a question</option>
          {% for q in questions %}
            <option value="{{ q }}">{{ q }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="mb-2"><label>Answer</label><input class="form-control" name="security_answer" required></div>

      {% if verified %}
        <hr />
        <div class="mb-2"><label>New Password</label><input type="password" class="form-control" name="new_password" required></div>
        <div class="mb-2"><label>Confirm Password</label><input type="password" class="form-control" name="confirm_password" required></div>
      {% endif %}

      <button class="btn btn-primary w-100">Submit</button>
    </form>

    <div class="mt-3"><a href="{{ url_for('auth') }}">Back to Login</a></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const imageData = [
      { src: "{{ url_for('static', filename='images/sunny.jpeg') }}", cls: "kenburns-sunny" },
      { src: "{{ url_for('static', filename='images/rain.jpeg') }}", cls: "kenburns-rain" },
      { src: "{{ url_for('static', filename='images/snow.jpeg') }}", cls: "kenburns-snow" }
    ];
    imageData.forEach(d=>new Image().src=d.src);
    let index=1,current=1; const bg1=document.getElementById('bg1'), bg2=document.getElementById('bg2');
    bg1.className=imageData[0].cls;
    function changeBackground(){const next=imageData[index],incoming=current===1?bg2:bg1,outgoing=current===1?bg1:bg2;incoming.style.backgroundImage=url(${next.src});incoming.className=next.cls;incoming.style.opacity=1;outgoing.style.opacity=0;current=current===1?2:1;index=(index+1)%imageData.length;}
    setInterval(changeBackground,4000);
  </script>
</body>
</html>
