<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Weather Forecast Hub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    html, body { height: 100%; margin: 0; font-family: Arial, sans-serif; overflow: hidden; background: transparent; }
    #bg1, #bg2 { position: fixed; top:0; left:0; width:100%; height:100%; background-size: cover; background-position:center; transition:opacity 1.5s; z-index:-2; }
    #bg1 { opacity:1; } #bg2{opacity:0;}
    .kenburns-sunny { animation: kbSunny 20s ease-in-out infinite; }
    .kenburns-rain { animation: kbRain 20s ease-in-out infinite; }
    .kenburns-snow { animation: kbSnow 20s ease-in-out infinite; }
    @keyframes kbSunny {0%{transform:scale(1)}50%{transform:scale(1.08) translate(10px,5px)}100%{transform:scale(1)}}
    @keyframes kbRain {0%{transform:scale(1)}50%{transform:scale(1.05) translate(-5px,10px)}100%{transform:scale(1)}}
    @keyframes kbSnow {0%{transform:scale(1)}50%{transform:scale(1.06) translate(5px,-5px)}100%{transform:scale(1)}}
    #overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.18);z-index:-1;}
    .card{width:420px;border-radius:18px;padding:2rem;background:rgba(0,0,0,0.6);backdrop-filter:blur(6px);color:#fff;position:absolute;top:10%;right:5%;z-index:10;}
    h3{text-shadow:1px 1px 3px #000;} p.text-muted{color:#ddd;}
    input.form-control{background:rgba(255,255,255,0.06);border:none;color:#fff;}
    input.form-control::placeholder{color:rgba(255,255,255,0.9);}
    label{font-weight:600;color:#fff;}
    .nav-tabs .nav-link{background:rgba(255,255,255,0.06);color:#fff;border:none;border-radius:8px;}
    .nav-tabs .nav-link.active{background:rgba(255,255,255,0.2);}
    .alert{background:rgba(255,255,255,0.06);color:#fff;border:none;}
    a.small-link{color:#0dcaf0;display:block;margin-top:8px;}
  </style>
</head>
<body>
  <div id="bg1" style="background-image:url('{{ url_for('static', filename='images/sunny.jpeg') }}');"></div>
  <div id="bg2"></div>
  <div id="overlay"></div>

  <div class="card">
    <h3>Weather Forecast Hub</h3>
    <p class="text-muted">Login or register</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <ul class="nav nav-tabs mb-3" id="tabs">
      <li class="nav-item">
        <button class="nav-link {% if active_tab=='login' %}active{% endif %}" data-bs-toggle="tab" data-bs-target="#login">Login</button>
      </li>
      <li class="nav-item">
        <button class="nav-link {% if active_tab=='register' %}active{% endif %}" data-bs-toggle="tab" data-bs-target="#register">Register</button>
      </li>
    </ul>

    <div class="tab-content">
      <!-- LOGIN -->
      <div class="tab-pane fade {% if active_tab=='login' %}show active{% endif %}" id="login">
        <form method="POST">
          <input type="hidden" name="action" value="login">
          <div class="mb-2"><label>Username</label><input class="form-control" name="username" placeholder="username" required></div>
          <div class="mb-2"><label>Password</label><input type="password" class="form-control" name="password" placeholder="password" required></div>
          <button class="btn btn-primary w-100">Login</button>
        </form>
        <a class="small-link" href="{{ url_for('forgot') }}">Forgot / Reset Password</a>
      </div>

      <!-- REGISTER -->
      <div class="tab-pane fade {% if active_tab=='register' %}show active{% endif %}" id="register">
        <form method="POST">
          <input type="hidden" name="action" value="register">
          <div class="mb-2"><label>Username</label><input class="form-control" name="username" placeholder="choose username" required></div>
          <div class="mb-2"><label>Password</label><input type="password" class="form-control" name="password" placeholder="password" required></div>
          <div class="mb-2"><label>Confirm Password</label><input type="password" class="form-control" name="confirm_password" placeholder="confirm password" required></div>
          <div class="mb-2"><label>Security Question</label>
            <select name="security_question" class="form-control" required>
              <option value="" disabled selected>Select a question</option>
              {% for q in questions %}
                <option value="{{ q }}">{{ q }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-2"><label>Answer</label><input class="form-control" name="security_answer" placeholder="answer" required></div>
          <button class="btn btn-success w-100">Register</button>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const imageData = [
      { src: "{{ url_for('static', filename='images/sunny.jpeg') }}", cls: "kenburns-sunny" },
      { src: "{{ url_for('static', filename='images/rain.jpeg') }}", cls: "kenburns-rain" },
      { src: "{{ url_for('static', filename='images/snow.jpeg') }}", cls: "kenburns-snow" }
    ];
    imageData.forEach(d => new Image().src = d.src);

    let index = 1, current = 1;
    const bg1 = document.getElementById('bg1'), bg2 = document.getElementById('bg2');
    bg1.className = imageData[0].cls;

    function changeBackground() {
      const next = imageData[index],
            incoming = current === 1 ? bg2 : bg1,
            outgoing = current === 1 ? bg1 : bg2;
      incoming.style.backgroundImage = `url(${next.src})`;
      incoming.className = next.cls;
      incoming.style.opacity = 1;
      outgoing.style.opacity = 0;
      current = current === 1 ? 2 : 1;
      index = (index + 1) % imageData.length;
    }
    setInterval(changeBackground, 4000);
  </script>
</body>
</html>
